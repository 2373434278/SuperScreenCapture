name: ci

on:
  push:
  pull_request:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Show SDK
        run: dotnet --info
      - name: Restore
        run: dotnet restore SuperScreenCapture.slnx
      - name: Build
        run: dotnet build SuperScreenCapture.slnx -c Release --no-restore
      - name: Test
        run: dotnet test SuperScreenCapture.slnx -c Release --no-build --logger "trx;LogFileName=test-results.trx"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore

  publish:
    name: publish (${{ matrix.rid }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            rid: osx-arm64
            tfm: net10.0
          - os: windows-2025
            rid: win-x64
            tfm: net10.0-windows10.0.19041.0
          # Intel macOS and Windows ARM64 runners are still rolling out.
          # Keep them as early-signal jobs without blocking the pipeline.
          - os: macos-15-intel
            rid: osx-x64
            tfm: net10.0
          - os: windows-11-arm
            rid: win-arm64
            tfm: net10.0-windows10.0.19041.0
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.rid == 'osx-x64' || matrix.rid == 'win-arm64' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish
        run: >
          dotnet publish src/SSC.App/SSC.App.csproj
          -c Release
          -f ${{ matrix.tfm }}
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=false
          -o artifacts/${{ matrix.rid }}
      - name: Verify dependencies
        shell: bash
        run: |
          set -euo pipefail
          find artifacts/${{ matrix.rid }} -maxdepth 1 -type f | sort | head -40
          if [ "${{ matrix.rid }}" = "win-arm64" ] || [ "${{ matrix.rid }}" = "win-x64" ]; then
            test -f artifacts/${{ matrix.rid }}/SSC.App.exe
          else
            test -x artifacts/${{ matrix.rid }}/SSC.App
          fi
      - name: Package macOS app bundle
        if: startsWith(matrix.rid, 'osx')
        shell: bash
        run: |
          chmod +x build/mac/create-app-bundle.sh
          ./build/mac/create-app-bundle.sh "artifacts/${{ matrix.rid }}" "artifacts/SuperScreenCapture-${{ matrix.rid }}.app"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ssc-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}
          if-no-files-found: error
      - name: Upload macOS app bundle
        if: startsWith(matrix.rid, 'osx')
        uses: actions/upload-artifact@v4
        with:
          name: ssc-${{ matrix.rid }}-app
          path: artifacts/SuperScreenCapture-${{ matrix.rid }}.app
          if-no-files-found: error
